services:
  # Web Service
  - type: web
    name: ferma-app
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ferma-db
          property: connectionString

  # PostgreSQL Database
  - type: pserv
    name: ferma-db
    env: postgres
    plan: free
    addons:
      - name: ferma-db
        plan: free
